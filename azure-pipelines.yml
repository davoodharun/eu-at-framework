trigger: none

parameters:
  - name: testTags
    displayName: 'Test tags to run (e.g. @login,@e2e)'
    type: string
    default: ''
  - name: testCategory
    displayName: 'Test category (e.g. login, outages, payments)'
    type: string
    default: ''
  - name: keyVaultUrl
    displayName: 'Azure Key Vault URL'
    type: string
    default: 'https://eu-test-credentials-stage-kv.vault.azure.net/'
  - name: environment
    displayName: 'Environment (stage/prod)'
    type: string
    default: 'stage'

pool:
  vmImage: 'ubuntu-latest'

variables: 
  - name: KEYVAULT_URL
    value: ${{ parameters.keyVaultUrl }}
  - group: terraform (non-prod)
  
steps:
  - checkout: self

  # Terraform Infrastructure Deployment

  # Python Setup
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.10'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install Python dependencies'

  # Download secrets from Key Vault and generate credentials.yml
  - script: |
      python scripts/keyvault_to_credentials.py
    displayName: 'Download secrets from Key Vault and generate credentials.yml'
    env:
      AZURE_CLIENT_ID: $(AzureClientId)
      AZURE_TENANT_ID: $(AzureTenantId)
      AZURE_CLIENT_SECRET: $(AzureClientSecret)
      KEYVAULT_URL: $(KEYVAULT_URL)

  # Node.js and Playwright Setup
  - script: |
      npm ci
      npx playwright install chromium
    displayName: 'Install Node.js dependencies and Playwright Chrome browser only'

  # Run Playwright Tests (Non-interactive)
  - script: |
      if [ "${{ parameters.environment }}" = "prod" ]; then
        if [ -n "${{ parameters.testTags }}" ]; then
          npm run test:prod:ci -- --grep "${{ parameters.testTags }}"
        elif [ -n "${{ parameters.testCategory }}" ]; then
          npm run test:prod:ci -- --grep "@${{ parameters.testCategory }}"
        else
          npm run test:prod:ci
        fi
      else
        if [ -n "${{ parameters.testTags }}" ]; then
          npm run test:stage:ci -- --grep "${{ parameters.testTags }}"
        elif [ -n "${{ parameters.testCategory }}" ]; then
          npm run test:stage:ci -- --grep "@${{ parameters.testCategory }}"
        else
          npm run test:stage:ci
        fi
      fi
    displayName: 'Run Playwright tests (non-interactive)'

  # Publish Test Results
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testRunner: JUnit
      testResultsFiles: 'test-results/*.xml'
      testRunTitle: 'Playwright Tests - ${{ parameters.environment }}'
    displayName: 'Publish JUnit Test Results'

  # Publish HTML Test Report
  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: 'playwright-report'
      artifact: 'playwright-report-${{ parameters.environment }}'
      publishLocation: 'pipeline'
    displayName: 'Publish HTML Test Report'

  # Publish JSON Test Results
  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: 'test-results'
      artifact: 'test-results-${{ parameters.environment }}'
      publishLocation: 'pipeline'
    displayName: 'Publish JSON Test Results'